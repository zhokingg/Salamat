name: salamat
description: "Salamat — nutrition tracker for Kazakhstan, Kyrgyzstan and Uzbekistan."
publish_to: 'none'

version: 1.0.0+10

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.0.0
  supabase_flutter: ^2.5.0
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.0
  camera: ^0.11.0
  image_picker: ^1.1.0
  dio: ^5.4.0
  http: ^1.2.0
  shared_preferences: ^2.2.3
  lottie: ^3.1.0
  shimmer: ^3.0.0
  confetti: ^0.7.0
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.0
  url_launcher: ^6.3.0
  intl: any
  uuid: ^4.4.0
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

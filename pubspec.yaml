name: salamat
description: "Salamat — nutrition tracker for Kazakhstan, Kyrgyzstan and Uzbekistan."
publish_to: 'none'

version: 1.0.0+11

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.0.0
  supabase_flutter: ^2.5.0
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.0
  camera: ^0.11.0
  image_picker: ^1.1.0
  dio: ^5.4.0
  http: ^1.2.0
  shared_preferences: ^2.2.3
  lottie: ^3.1.0
  shimmer: ^3.0.0
  confetti: ^0.7.0
  lucide_icons: ^0.257.0
  phosphor_flutter: ^2.1.0
  flutter_svg: ^2.0.10
  flutter_animate: ^4.5.0
  url_launcher: ^6.3.0
  intl: any
  uuid: ^4.4.0
  permission_handler: ^11.3.0
  purchases_flutter: ^8.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/food_icons/

# App launcher icon — Salamat brand sprout (green #26593C). Regenerate with:
#   /Users/user/flutter/bin/dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_full.png"
  remove_alpha_ios: true
  background_color_ios: "#26593C"
  adaptive_icon_background: "#26593C"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
